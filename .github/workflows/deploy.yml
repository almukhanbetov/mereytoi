name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mereytoi-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mereytoi-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://mereytoi.kz
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mereytoi-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mereytoi-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify VPS deploy directory exists and is writable
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            test -d "${{ secrets.VPS_PATH }}" || {
              echo "VPS_PATH does not exist: ${{ secrets.VPS_PATH }}"
              exit 1
            }

            test -w "${{ secrets.VPS_PATH }}" || {
              echo "VPS_PATH is not writable: ${{ secrets.VPS_PATH }}"
              exit 1
            }

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.VPS_PATH }}
          overwrite: true

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd "${{ secrets.VPS_PATH }}"

            test -f docker-compose.prod.yml || {
              echo "docker-compose.prod.yml not found"
              exit 1
            }

            test -f .env || {
              echo ".env not found in ${{ secrets.VPS_PATH }}"
              exit 1
            }

            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

            docker compose \
              -p mereytoi-prod \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -p mereytoi-prod \
              -f docker-compose.prod.yml \
              up -d --remove-orphans

            docker compose \
              -p mereytoi-prod \
              -f docker-compose.prod.yml \
              ps