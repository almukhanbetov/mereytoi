name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mereytoi-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mereytoi-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Origin only, no /api suffix: src/lib/*Api.js already prefix every
          # call with /api/..., and media.js builds /uploads/... paths (a
          # separate static route, not under /api). Adding /api here would
          # produce /api/api/... and break /uploads/... image URLs.
          build-args: |
            NEXT_PUBLIC_API_URL=https://mereytoi.kz
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mereytoi-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mereytoi-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure VPS deploy directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p "${{ secrets.VPS_PATH }}"

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.VPS_PATH }}

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd "${{ secrets.VPS_PATH }}"
            test -f docker-compose.prod.yml
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            docker compose -p mereytoi-prod -f docker-compose.prod.yml pull
            docker compose -p mereytoi-prod -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -p mereytoi-prod -f docker-compose.prod.yml ps
